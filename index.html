    <script>
      // Progressive enhancement + motion preference, applied before first paint.
      (function () {
        var root = document.documentElement;
        root.classList.remove('no-js');
        root.classList.add('has-js');
        var stored = null;
        try {
          stored = window.localStorage.getItem('ob4cl.motion');
        } catch (err) {
          stored = null;
        }
        var reduced = false;
        try {
          reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        } catch (err) {
          reduced = false;
        }
        root.setAttribute('data-motion', stored === 'off' || (stored !== 'on' && reduced) ? 'off' : 'on');
      })();
    </script>
